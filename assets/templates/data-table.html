<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparison Table</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --border: rgba(23, 38, 64, 0.14);
      --text: #172640;
      --muted: #5f6b7d;
      --accent: #2b6cb0;
      --accent-soft: rgba(43, 108, 176, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", Georgia, serif;
      background:
        radial-gradient(circle at top right, rgba(43,108,176,0.12), transparent 24rem),
        var(--bg);
      color: var(--text);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 44px 20px 60px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 36px rgba(32, 53, 87, 0.08);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    caption {
      text-align: left;
      font-weight: 700;
      margin-bottom: 12px;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(23, 38, 64, 0.09);
      vertical-align: top;
      text-align: left;
    }
    thead th {
      background: var(--accent-soft);
      position: sticky;
      top: 0;
    }
    tbody tr:nth-child(even) {
      background: rgba(43, 108, 176, 0.03);
    }
    .muted {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <table>
        <caption>Comparison</caption>
        <thead>
          <tr>
            <th scope="col">Item</th>
            <th scope="col">Strength</th>
            <th scope="col">Risk</th>
            <th scope="col">Recommendation</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Option A</td>
            <td>Explain the best part.</td>
            <td class="muted">Explain the main downside.</td>
            <td>Use when it clearly fits.</td>
          </tr>
          <tr>
            <td>Option B</td>
            <td>Another useful trait.</td>
            <td class="muted">Main limitation.</td>
            <td>Use in a narrower situation.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
