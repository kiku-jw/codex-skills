<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowchart</title>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: true,
      theme: 'base',
      themeVariables: {
        primaryColor: '#efe2cf',
        primaryTextColor: '#2a241f',
        primaryBorderColor: '#8e5c35',
        lineColor: '#6f6458',
        tertiaryColor: '#f8f4ee',
        fontFamily: 'Georgia, serif'
      }
    });
  </script>
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: linear-gradient(180deg, #f7f1e8 0%, #efe6da 100%);
      color: #2a241f;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 20px 56px;
    }
    .hero {
      margin-bottom: 18px;
    }
    .panel {
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(49,39,30,0.16);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 16px 40px rgba(47,35,24,0.12);
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>Flow Overview</h1>
      <p>Replace the graph below with the actual flow.</p>
    </section>
    <section class="panel">
      <pre class="mermaid">
graph TD
  A[Start] --> B[Process]
  B --> C[Decision]
  C -->|Yes| D[Ship]
  C -->|No| E[Revise]
      </pre>
    </section>
  </main>
</body>
</html>
